name = "classaid"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "out"

# Workers AI - used for BGE-base-en-v1.5 embeddings (768 dimensions)
[ai]
binding = "AI"

# Environment variables for Pages Functions
# Note: Sensitive values (SUPABASE_SERVICE_ROLE_KEY, GROQ_API_KEY) must be set
# via Cloudflare dashboard or wrangler CLI as secrets, NOT in this file.
# See docs/DEPLOYMENT.md for full setup instructions.
[vars]
SUPABASE_URL = "https://your-project.supabase.co"
# SUPABASE_SERVICE_ROLE_KEY = "set via: wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY"
# GROQ_API_KEY = "set via: wrangler pages secret put GROQ_API_KEY"
